name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # This maintenance fork validates the installed release against that release's
    # immutable upstream workflow. Moving master requires scripts from newer releases.
    # The upstream identity guard routes this fork to standard GitHub-hosted runners.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@bba6a45f0d364cfd962ac59b3bdf2426a8222adb

  review-preflight-store:
    name: Review preflight store PostgreSQL
    # This maintenance validation must never fall back to paid private or custom runners.
    if: github.repository == 'martinmarquez/paperclip' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Match the release-pinned canonical install policy for its stale merge-tree lockfile.
      - run: |
          if ! pnpm install --frozen-lockfile; then
            pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
            pnpm install --frozen-lockfile
          fi
      - name: Locate existing runner PostgreSQL tools
        run: |
          pg_bindir="$(pg_config --bindir)"
          test -x "$pg_bindir/initdb"
          test -x "$pg_bindir/pg_ctl"
          echo "$pg_bindir" >> "$GITHUB_PATH"
      - name: Verify store API, processes, restart and JSON evidence
        run: |
          pnpm --filter @paperclipai/db exec tsx src/review-preflight-schema-check.mjs
          bash scripts/test-review-preflight-sql-store-pg.sh
      - name: Package the reviewed maintenance runtime candidate
        env:
          PAPERCLIP_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/package-review-preflight-runtime.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: review-preflight-runtime-${{ github.event.pull_request.head.sha }}
          path: runtime-candidate/review-preflight-runtime.json.gz
          retention-days: 1
          if-no-files-found: error
